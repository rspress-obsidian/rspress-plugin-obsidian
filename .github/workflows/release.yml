name: Release

# semantic-release reads the full commit history, so this must not be a
# shallow checkout. It only publishes when a releasable commit lands on main;
# everything else exits after the analysis step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm trusted publishing: the workflow's OIDC token is exchanged
  # for a short-lived, single-publish credential, and for the provenance
  # attestation npm attaches automatically.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # 1.3.x cannot parse this repo's version-2 lockfile; every other
          # workflow is pinned to the same major for the same reason.
          bun-version: 1.4.x

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No NPM_TOKEN on purpose. `@semantic-release/npm` detects the GitHub
      # Actions OIDC context (`id-token: write` above) and exchanges it for a
      # short-lived publish credential, so this step — the semantic-release
      # plugins plus the `prepublishOnly` gate (lint, typecheck, test, build,
      # packed-tarball checks) — never holds a long-lived npm write token that
      # project code or a compromised dependency could exfiltrate. It publishes
      # with the `npm` it depends on (`^11.6.2`, above trusted publishing's
      # 11.5.1 floor), not the runner's Node-bundled CLI.
      #
      # Maintainer setup, once per package on npmjs.com: Settings ->
      # Trusted publisher -> GitHub Actions, with org/user
      # `rspress-obsidian`, repository `rspress-plugin-obsidian`, workflow
      # filename `release.yml` (filename only, case-sensitive), and `npm
      # publish` allowed — trusted publishers created after 2026-09-03 permit
      # `npm stage publish` by default and must opt in to direct publishing.
      # The package's `repository.url` must keep pointing at this repository.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run release
