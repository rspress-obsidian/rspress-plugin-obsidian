name: CI

on:
  push:
    # `dev` is where the package is developed; without it, a push runs no
    # workflow at all and nothing is linted, built or tested until a PR to main.
    branches: [main, dev]
  pull_request:
    # `dev` too: Dependabot opens its upgrade PRs against `dev`, and each must
    # pass this matrix before it is merged.
    branches: [main, dev]

# Every job here only reads the checkout; the release workflow carries the
# write scopes it needs.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in flight. On main
# that is safe too: the release workflow only fires on a run that completed
# successfully, and the superseding run's success releases both commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · ${{ matrix.os }}
    # The package claims Windows, macOS and Linux, so the whole pipeline runs on
    # all three: path handling, line endings and shell quoting are exactly where
    # a Linux-only matrix stays green while the package is broken elsewhere.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing must not cancel the other two — the failure report
      # is the point of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Git Bash ships with all three runners and is the one shell whose
        # `test -f`, `cmd && cmd` and `VAR=1 cmd` behave everywhere. What this
        # matrix is proving is the behaviour of `bun.exe` / `node.exe` on each
        # platform, not PowerShell's quoting rules.
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every job reads the Bun version from `packageManager` in package.json:
      # the committed `bun.lock` is lockfileVersion 2, which Bun < 1.4 cannot
      # parse (verified against 1.3.14), so one source of truth keeps the
      # workflows from drifting apart again.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The publish test packs the tarball with `npm`, and the runner images
      # differ in whether npm is on PATH (and at which version) by default.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Type check the documented configs
        # Runs after the build because it resolves `rspress-plugin-obsidian`
        # through the package's own `types` entry — a config that names a
        # removed export, a misspelled option, or a plugin shape Rspress rejects
        # is a string in a fenced code block, so no other check here sees it.
        run: bun run test:doc-examples

      - name: Verify dist output
        # The job-level `defaults.run.shell: bash` above already covers this;
        # the step names it too because `test -f` and `&&`-chaining are
        # POSIX-shell syntax and the step must stay portable if it moves.
        shell: bash
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/markdown/index.d.ts
          test -f dist/canvas/index.d.ts
          test -f dist/graph/index.d.ts
          test -f dist/graph/runtime/GraphPanel.d.ts
          test -f dist/styles.css
          bun run test:publish

      # `publint` checks the exports map, `files` and the types-condition form
      # against what the package ships. attw is not used: it drives the
      # TypeScript compiler API in-process, which TypeScript 7 does not expose,
      # and the repo builds with TypeScript 7 only.
      - name: Public API checks
        shell: bash
        run: bun run test:types

      # scripts/check-coverage.ts holds both floors for the shipped source: 0.85
      # per src/ module (no exceptions) and 97% overall. bunfig's
      # coverageThreshold is only a backstop — Bun applies it per file and has no
      # exception mechanism, so it cannot express either floor. This is also the
      # only unit-test run: `bun test --coverage` runs the whole suite except
      # `test/publish/`, which `test:publish` above already ran against the packed
      # tarball (it measures `dist/`, never `src/`, so the floors lose nothing).
      # A separate plain `bun test` step would run every test twice.
      - name: Coverage gate
        # Same command a contributor runs locally, so "green here" and "green
        # there" cannot mean different floors.
        run: bun run test:coverage

      # The gate consumes `coverage/lcov.info` and then leaves it on the
      # runner's disk. Upload it per matrix leg so a coverage regression can be
      # diffed (and the numbers read) without reproducing the whole matrix
      # locally — `always()` because a *failing* gate is exactly when the
      # report is wanted. Legs that never reached the step upload nothing.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      # `docs:build` runs the plugin through Rspress' real build pipeline — the
      # closest thing to a consumer build this repo has — and the integration
      # suite then asserts what that build emitted. Both were Linux-only, which
      # is how a plugin can pass every unit test and still fail to build a site
      # on Windows.
      - name: Build docs site
        run: bun run docs:build

      - name: Run rspress build integration tests
        run: bun test test/markdown/integration.test.ts
        env:
          RUN_DOCS_BUILD_TESTS: "1"

      # Wall-clock budgets are runner-dependent, so the benchmark suite asserts
      # them only under RUN_BENCH_TESTS=1, and even then it is advisory: one slow
      # 2-vCPU runner must not take the result above down with it. Only the
      # Linux leg contributes a number.
      - name: Benchmarks (advisory)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: RUN_BENCH_TESTS=1 bun test test/markdown/benchmark.test.ts

  node:
    name: Node ${{ matrix.node-version }} · published entries
    # `engines` promises Node >= 22.14, but every other job runs Bun. Load both
    # published entry formats under Node so a bundler-only regression (the CJS
    # `import.meta.dirname` crash and the ESM dynamic-require failure both
    # shipped once) cannot pass unnoticed. Bundler output is platform-neutral,
    # so one OS covers it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 22.14.0 is the floor `engines` declares, not merely the 22.x line's
        # newest patch — pin it so the minimum is the one exercised.
        node-version: ['22.14.0', 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Load every published entry under Node
        # POSIX shell syntax (`for … done`, single-quoted `node -e` scripts) and
        # multi-command fail-fast; named explicitly so this job can pick up
        # another OS without the step silently turning into a no-op.
        shell: bash
        run: |
          # The three feature factories are the package's whole public surface,
          # so all three are asserted rather than one: a rename that drops a
          # factory from the entry must fail here, not only on a user's site.
          node -e 'const m = require("./dist/index.cjs"); for (const f of ["markdown","canvas","graphview","pluginObsidian"]) if (typeof m[f] !== "function") { console.error("missing CJS export:", f); process.exit(1) }'
          node --input-type=module -e 'const m = await import("./dist/index.js"); for (const f of ["markdown","canvas","graphview","pluginObsidian"]) if (typeof m[f] !== "function") { console.error("missing ESM export:", f); process.exit(1) }'
          for entry in markdown canvas graph; do
            node -e "const m = require(\"./dist/$entry.cjs\"); if (Object.keys(m).length === 0) process.exit(1)"
            node --input-type=module -e "const m = await import(\"./dist/$entry.js\"); if (Object.keys(m).length === 0) process.exit(1)"
          done

  lint:
    name: Lint
    # Biome's findings are source-level, not platform-level.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  consumer-site:
    name: Consumer site · Rspress ${{ matrix.rspress }} · mermaid ${{ matrix.mermaid }} · graph ${{ matrix.graph }}
    # The docs site, the integration suite and e2e all import the plugin from
    # `src/`, so none of them compiles what the tarball ships: the tsup browser
    # chunks Rspress loads by path, the exports map, the CJS/ESM entries. This
    # job installs the `npm pack` tarball into a minimal Rspress site outside
    # the repository (so nothing resolves through the repo's node_modules),
    # builds it with all three plugins, and smoke-checks the output. Mermaid is
    # an optional peer, so the site is built both without and with it; so is
    # `react-force-graph-2d`, which one extra leg leaves out (before the plugin
    # aliased it away, a site without it failed to build).
    #
    # `rspress` is the Rspress the site builds with: `min` is the version the
    # fixture pins, the floor of the `^2.0.21` peer range; `latest` is the
    # newest 2.x at least 3 days old. The plugin reaches into Rspress and
    # Rspack internals (the dev invalidation hold, the page modules hover
    # previews render), so a new release can break it with no change here.
    # That leg is advisory, like the benchmark step above: it reports the break
    # without stopping a release for an upstream change this commit did not
    # make.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.rspress == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        mermaid: [absent, installed]
        rspress: [min, latest]
        graph: [installed]
        include:
          - mermaid: absent
            rspress: min
            graph: absent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # The installs below resolve the newest versions in each range, so hold
      # npm to releases at least 3 days old, the same window as bunfig.toml's
      # `minimumReleaseAge` and Dependabot's `cooldown`: a compromised or broken
      # release is usually yanked within it. `--before` (as `npm_config_before`)
      # because Node 22's npm 10 has no `min-release-age`.
      - name: Hold npm to releases at least 3 days old
        run: echo "npm_config_before=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # npm, not bun: this is the install a consumer runs, and npm installs
      # required peers but leaves optional ones (mermaid, mathjax-full) out.
      #
      # The fixture lists `react-force-graph-2d` so the graph panel draws; the
      # `graph: absent` leg drops it before installing, as a consumer who skipped
      # the optional peer would have it. Uninstalling it afterwards is not
      # enough: npm 10 keeps it in the tree as the plugin's optional peer.
      - name: Install the tarball into the fixture site
        env:
          GRAPH: ${{ matrix.graph }}
        run: |
          cp -R test/consumer-site "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          if [ "$GRAPH" = absent ]; then npm pkg delete dependencies.react-force-graph-2d; fi
          npm install --no-audit --no-fund "$RUNNER_TEMP"/rspress-plugin-obsidian-*.tgz
          if [ "$GRAPH" = absent ] && [ -e node_modules/react-force-graph-2d ]; then
            echo "::error::react-force-graph-2d is installed in the leg that builds without it"
            exit 1
          fi

      # The peer range spans two Mermaid majors, so the tarball is built with
      # each: the `min` legs install the oldest allowed major (11.x) beside the
      # Rspress floor, the `latest` leg the newest allowed major (12.x) beside
      # the newest Rspress.
      - name: Add the optional mermaid peer
        if: matrix.mermaid == 'installed'
        working-directory: ${{ runner.temp }}/site
        env:
          MERMAID_RANGE: ${{ matrix.rspress == 'latest' && '^12.2.0' || '^11.17.2' }}
        run: npm install --no-audit --no-fund "mermaid@$MERMAID_RANGE"

      # Within the peer range the tarball declares, so npm resolves the newest
      # 2.x old enough for the gate above instead of the fixture's pinned floor.
      - name: Use the latest Rspress 2.x
        if: matrix.rspress == 'latest'
        working-directory: ${{ runner.temp }}/site
        run: npm install --no-audit --no-fund @rspress/core@^2.0.21

      - name: Build the fixture site
        working-directory: ${{ runner.temp }}/site
        run: npx rspress build

      - name: Smoke-check the build output
        working-directory: ${{ runner.temp }}/site
        env:
          MERMAID: ${{ matrix.mermaid }}
        run: node smoke.mjs

  e2e:
    name: E2E · ${{ matrix.os }}
    # Chromium on Linux and macOS. Both installs are a download plus an
    # unzip; the Windows image pulls a browser-dependency SDK chain that has
    # nothing to do with this package.
    needs: [test, lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--with-deps` shells out to apt-get, which only exists on Linux; macOS
      # ships the system libraries Chromium links against.
      - name: Install Playwright browsers
        run: bunx playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      # `playwright.config.ts` refuses to run against a `doc_build` older than
      # its inputs, and the rspress build integration suite runs in the `test`
      # matrix immediately after the same build.
      - name: Build docs site
        run: bun run docs:build

      - name: Run e2e tests
        run: bun run test:e2e

      # `trace: "on-first-retry"` plus `retries: 2` means a flaky or failing
      # test leaves a trace under `test-results/`, and the CI reporter above
      # writes the HTML report under `playwright-report/`. Both are gitignored
      # and local-only unless uploaded — and a failure is exactly when they are
      # needed, so this runs on failure and ignores legs where nothing was
      # produced (e.g. the suite never started).
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
