# -------------------------------------------------------------------
# bunfig.toml — rspress-plugin-obsidian
# -------------------------------------------------------------------

[install]
# Cache downloaded packages locally (faster reinstallation after
# node_modules is cleared, and faster `bun install` in CI)
cache = true
# Install peer dependencies automatically (@rspress/core, react, react-dom,
# react-force-graph-2d are needed for local dev and test to work)
peer = true
# Refuse to install when package.json and bun.lock disagree (CI already passes
# --frozen-lockfile). A silently rewritten lockfile is how "works on my machine"
# starts; an intentional dependency change should update the lock in the same
# commit.
frozenLockfile = true

[test]
# Bun's `[test]` section has no `timeout`, `bail` or `quiet` key — all three were
# here and all three were inert (verified on Bun 1.4.2: `bail = true` still
# reported every failure, `timeout = 12000` still killed a 6.5s test at the 5s
# default). Per-test timeout and fail-fast iteration are CLI flags
# (`bun test --timeout 30000 --bail`); CI wants every failure, so it passes
# neither.
# happy-dom for component tests (graph runtime, canvas embed)
preload = ["./test/test-setup.ts"]
# Coverage must measure the code we ship, not build output, tests or tooling:
# `dist/` is the built bundle (the publish test imports it), `doc_build/` is a
# generated site, and `scripts/` is not in package.json `files`.
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["dist/**", "doc_build/**", "coverage/**", "test/**", "scripts/**"]
# Backstop only, and deliberately weak: Bun applies this to *every* measured
# file and has no exception mechanism, so it trips on a module that is imported
# and never exercised (0%) without being the gate. The real floors live in
# `scripts/check-coverage.ts`, which CI runs against the lcov report: 0.85 per
# shipped `src/` module, with no exceptions (only modules no unit test can load
# are listed, each printed with its reason on every run), plus 97% over `src/`
# as a whole. `statements` is accepted, not enforced.
coverageThreshold = { lines = 0.5, functions = 0.5 }

[debug]
# Enable frontend debugging — attaches to React DevTools and provides
# richer error traces for component rendering
frontend = true
